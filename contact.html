<p>Want to get in touch? Fill out the form below to send me a message and I will get back to you as soon as possible!</p>

<form class="form-group" name="simple-contact-form" accept-charset="utf-8" action="https://formspree.io/f/xovaqlwr" method="post">
  <fieldset class="form-group">
    <div class="control-group">
      <div class="form-group floating-label-form-group controls">
        <label for="full-name">Name</label>
        <input type="text" name="name" id="full-name" placeholder="Name" required data-validation-required-message="Please enter your name.">
        <p class="help-block text-danger"></p>
      </div>
    </div>
    <div class="control-group">
      <div class="form-group floating-label-form-group controls">
        <label for="email-address">Email</label>
        <input type="email" name="_replyto" id="email-address" placeholder="email@domain.tld" required="">
     </div>
    </div>
    <div class="control-group">
      <div class="form-group floating-label-form-group controls">
        <label for="message">Message</label>
        <textarea rows="5" name="message" id="message" placeholder="Message" required=""></textarea>
      <input type="hidden" name="_subject" id="email-subject" value="Contact Form Submission">
      </div>
    </div>
  </fieldset>
    <button type="submit">Send</button>
</form>
